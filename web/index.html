<title>CrazyTV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: Vollbild-3D-Tower, HUD oben, Raumleiste unten, Raum-Panels als Bottom-Sheet (mobil) bzw. Seitenleiste (Desktop).
   Bewusst ein einziges Look: Abendprogramm-Indigo mit Bonbonfarben der drei Sender. */
:root {
  color-scheme: dark;
  --ink: #17142e;
  --panel: #221d44;
  --panel-2: #2d2758;
  --line: #3d3672;
  --text: #fbf6ec;
  --muted: #b9b1db;
  --k7: #19c3b1;
  --trash: #ff4f9a;
  --prestige: #f0b429;
  --good: #5fd68f;
  --bad: #ff6b6b;
  --warn: #ffc857;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--body); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.num { font-variant-numeric: tabular-nums; }

/* Raum-Schilder im 3D */
.room-label { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 3px 9px 3px 9px; border-radius: 999px; border: 0; background: rgba(23, 20, 46, 0.82); color: var(--text); font-family: var(--display); font-weight: 600; font-size: 12.5px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
.room-label.closed { opacity: 0.6; }
.room-label.occupied { box-shadow: 0 0 0 2px var(--occ), 0 2px 6px rgba(0,0,0,0.25); }
.room-label .rl-occ { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--occ); color: var(--ink); font-weight: 700; }
.room-label .rl-occ:empty { display: none; }
#labels.compact .room-label { font-size: 10px; padding: 2px 6px; }
.player-marker { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 700; font-size: 11px; background: var(--k7); color: var(--ink); padding: 1px 7px; border-radius: 999px; }
.player-marker::after { content: ''; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--k7); }

/* HUD */
#hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.hud-row { display: flex; gap: 8px; align-items: stretch; }
.hud-card { pointer-events: auto; background: rgba(34, 29, 68, 0.92); border-radius: var(--r); padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; min-width: 0; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
.hud-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.hud-val { font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.15; white-space: nowrap; }
#clockCard { flex: 0 0 auto; }
#clock { font-size: 22px; }
.clockbar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 3px; overflow: hidden; }
.clockbar i { display: block; height: 100%; background: var(--warn); width: 0; }
#moneyCard { flex: 1 1 auto; position: relative; }
.mfloat { position: absolute; right: 10px; top: 4px; font-family: var(--display); font-weight: 700; font-size: 14px; pointer-events: none; animation: mfloat 1.6s ease-out forwards; }
.mfloat.up { color: var(--good); }
.mfloat.down { color: var(--bad); }
@keyframes mfloat { from { transform: translateY(0); opacity: 1; } to { transform: translateY(26px); opacity: 0; } }
#imageCard { flex: 1.3 1 0; }
.imagebar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin-top: 4px; gap: 2px; }
.imagebar i { display: block; height: 100%; transition: flex-grow 0.6s; }
.imgnums { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; margin-top: 2px; }
.ctrl { flex: 0 0 auto; display: flex; gap: 6px; pointer-events: auto; }
.icon-btn { width: 44px; border: 0; border-radius: var(--r); background: rgba(34, 29, 68, 0.92); font-size: 18px; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
.icon-btn.on { background: var(--warn); color: var(--ink); }
#ticker { pointer-events: auto; align-self: flex-start; max-width: 100%; background: rgba(255, 200, 87, 0.95); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; text-align: left; }
#ticker:empty { display: none; }
.slot.past { opacity: 0.55; }
.slot-prog.locked { cursor: default; }
.slot.live .slot-prog { box-shadow: 0 0 0 2px var(--bad); }

/* Mini-Fernseher (unten links) */
#minitv { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: 172px; z-index: 6; }
.tv-case { background: linear-gradient(160deg, #4a3b2c, #2b2219); border-radius: 16px; padding: 7px 7px 5px; box-shadow: 0 8px 22px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
#tvCanvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px / 14px; background: #0d0f18; cursor: pointer; box-shadow: inset 0 0 12px rgba(0,0,0,0.6); }
.tv-ctrl { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.tv-ch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.45); background: var(--c); opacity: 0.45; padding: 0; }
.tv-ch.on { opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.8); }
.tv-v { flex: 1; text-align: right; font-family: var(--display); font-weight: 600; font-size: 13px; color: #f3e6cf; white-space: nowrap; }
.tv-sofa { border: 0; background: rgba(0,0,0,0.3); border-radius: 8px; width: 26px; height: 22px; font-size: 13px; padding: 0; }
#minitv.mini { width: 96px; }
#minitv.mini .tv-ctrl { display: none; }
@media (min-width: 900px) {
  #minitv { width: 250px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
  #nav { padding-left: 280px; }
  .tv-ch { width: 22px; height: 22px; }
  .tv-v { font-size: 15px; }
}
@media (max-width: 899px) {
  body.panel-open #minitv { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 112px); width: 150px; }
  body.panel-open #minitv .tv-sofa { display: none; }
  body.panel-open #ticker { display: none; }
}

/* Raumleiste */
#nav { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#status { align-self: center; pointer-events: none; background: rgba(23, 20, 46, 0.85); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status:empty { display: none; }
.chips { pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; justify-content: safe center; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 0; border-radius: 999px; background: rgba(34, 29, 68, 0.95); padding: 9px 13px; font-weight: 800; font-size: 13.5px; display: flex; gap: 6px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
.chip.target { background: var(--k7); color: var(--ink); }

/* Panel */
#panel { box-sizing: border-box; position: absolute; left: 0; right: 0; bottom: 0; max-height: 74%; display: flex; flex-direction: column; background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.4); transform: translateY(105%); transition: transform 0.28s cubic-bezier(.2,.9,.3,1.1); padding-bottom: env(safe-area-inset-bottom, 0px); }
#panel.open { transform: translateY(0); }
@media (max-width: 899px) {
  #panel { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 62px); max-height: calc(100% - env(safe-area-inset-top, 0px) - 230px); }
  body.panel-open #status { display: none; }
  body.panel-open #nav { background: linear-gradient(transparent, var(--panel) 30%); }
}
@media (min-width: 900px) {
  #panel { left: auto; top: 0; right: 0; width: 440px; max-height: none; border-radius: 22px 0 0 22px; transform: translateX(105%); padding-top: env(safe-area-inset-top, 0px); }
  #panel.open { transform: translateX(0); }
  body.panel-open #nav, body.panel-open #hud { right: 440px; }
  body.panel-open #toasts { left: calc(50% - 220px); }
}
.p-head { display: flex; align-items: center; gap: 12px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.p-avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; flex: 0 0 auto; }
.p-title { flex: 1; min-width: 0; }
.p-title h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 21px; text-wrap: balance; }
.p-title p { margin: 0; color: var(--muted); font-size: 13px; }
.p-close { border: 0; background: var(--panel-2); border-radius: 12px; width: 40px; height: 40px; font-weight: 800; font-size: 16px; flex: 0 0 auto; }
.p-body { overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; user-select: text; -webkit-user-select: text; }
.bubble { background: var(--panel-2); border-radius: 16px; padding: 10px 14px; font-size: 14.5px; line-height: 1.45; position: relative; }
.bubble b { color: var(--warn); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 0; background: var(--panel-2); border-radius: 999px; padding: 7px 13px; font-weight: 800; font-size: 13px; }
.tab.on { background: var(--text); color: var(--ink); }
.sec-title { font-family: var(--display); font-weight: 600; font-size: 15px; margin: 6px 0 0; color: var(--muted); }
.card { background: var(--panel-2); border-radius: var(--r); padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.card .grow { flex: 1; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; font-weight: 800; line-height: 1.25; }
.card p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 999px; background: var(--line); color: var(--text); font-size: 11.5px; font-weight: 800; }
.pill.good { background: rgba(95, 214, 143, 0.2); color: var(--good); }
.pill.bad { background: rgba(255, 107, 107, 0.2); color: var(--bad); }
.pill.warn { background: rgba(255, 200, 87, 0.2); color: var(--warn); }
.btn { border: 0; border-radius: 12px; padding: 9px 13px; font-weight: 800; font-size: 13.5px; background: var(--k7); color: var(--ink); white-space: nowrap; }
.btn.alt { background: var(--line); color: var(--text); }
.btn.gold { background: var(--prestige); }
.btn.pink { background: var(--trash); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.price { font-family: var(--display); font-weight: 600; font-size: 15px; white-space: nowrap; }
.stars { color: var(--warn); letter-spacing: -1px; font-size: 12px; }
.qbar { width: 60px; height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.qbar i { display: block; height: 100%; background: var(--k7); }
.empty { color: var(--muted); font-size: 13.5px; padding: 8px 2px; }

.card.trend { background: linear-gradient(135deg, rgba(255,79,154,0.25), rgba(25,195,177,0.25)); }
.card.done { opacity: 0.6; }
.card .btn + .btn { margin-left: -4px; }
.spy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.spy > div { background: var(--panel-2); border-radius: var(--r); padding: 8px 10px; min-width: 0; }
.spy h4 { margin: 0 0 4px; font-family: var(--display); font-size: 15px; }
.spy p { margin: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.manual h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 8px 0 0; }
.manual p { margin: 2px 0 0; font-size: 14px; line-height: 1.55; color: var(--text); }
.title-screen .logo { font-size: 64px; padding: 24px 0 8px; }

.dayswitch { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.dayswitch b { font-family: var(--display); font-weight: 600; font-size: 17px; min-width: 70px; text-align: center; }
.dayswitch .btn { padding: 6px 12px; }
.tb-m .ep { background: rgba(23, 20, 46, 0.18); border-radius: 6px; padding: 0 5px; font-size: 11.5px; }
.pi-eps { display: flex; gap: 3px; height: 26px; align-items: flex-end; }
.pi-eps i { flex: 1; border-radius: 3px 3px 0 0; background: var(--good); height: calc(var(--f) * 100%); min-height: 3px; opacity: 0.75; }
.pi-eps i.next { opacity: 1; box-shadow: 0 0 0 2px var(--text); }

/* Sendungs-Infokarte */
.pi-head { display: flex; gap: 12px; align-items: center; background: var(--gc); color: var(--ink); padding-bottom: 14px; }
.m-head.pi-head p { color: rgba(23, 20, 46, 0.78); font-weight: 700; }
.pi-icon { font-size: 40px; }
.pi-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pi-stats div { background: var(--panel-2); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pi-stats small { color: var(--muted); font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi-stats b { font-family: var(--display); font-weight: 600; font-size: 15px; }
.pi-stats .qbar { width: 100%; }
.pi-groups { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pi-groups div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 18px; }
.pi-groups .qbar { width: 100%; }
.pi-hours { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; align-items: end; height: 120px; }
.pi-h { position: relative; height: 100%; border: 0; border-radius: 8px; background: var(--panel-2); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 3px 0; overflow: hidden; }
.pi-h i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(25, 195, 177, 0.45); }
.pi-h.best i { background: var(--k7); }
.pi-h.cur { box-shadow: 0 0 0 2px var(--text); }
.pi-h b, .pi-h span, .pi-h em { position: relative; font-size: 11px; font-weight: 800; }
.pi-h b { font-family: var(--display); font-size: 12.5px; }
.pi-h em { position: absolute; top: 3px; font-style: normal; color: var(--warn); }
.pi-h.no { opacity: 0.35; }
.pi-h.none { opacity: 0.25; justify-content: flex-end; }
@media (max-width: 420px) { .pi-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Programmplaner: Zeitleiste + Regal (Drag & Drop) */
.tl { flex: 0 0 auto; position: relative; margin-right: 0; user-select: none; -webkit-user-select: none; }
.tl-row { position: absolute; left: 0; right: 0; height: 44px; border-top: 1px dashed var(--line); z-index: 0; }
.tl-row span { position: absolute; left: 0; top: 4px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); }
.tl-row.prime span { color: var(--warn); }
.tl-block, .tl-prev { position: absolute; left: 30px; right: 92px; border-radius: 10px; padding: 4px 8px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0 6px; overflow: hidden; }
.tl-block { z-index: 1; background: var(--gc, var(--panel-2)); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); touch-action: none; cursor: grab; }
.tl-block.testbild { background: repeating-linear-gradient(90deg, #f6f4ef 0 12%, #f4c34f 12% 25%, #4fd1ff 25% 37%, #5fd68f 37% 50%, #ff6fa8 50% 62%, #e2574c 62% 75%, #4f8fe2 75% 87%, #2d3140 87%); opacity: 0.4; justify-content: center; align-items: center; cursor: default; }
.tl-block.live { box-shadow: 0 0 0 2px var(--bad), inset 0 -3px 0 rgba(0,0,0,0.18); cursor: default; }
.tl-block.past { opacity: 0.45; cursor: default; }
.tl-block.dragging, .shelf-card.dragging { opacity: 0.3; }
.tb-i { font-size: 16px; }
.tb-t { font-weight: 800; font-size: 13px; line-height: 1.25; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 2px; }
.tb-m { width: 100%; display: flex; gap: 5px; justify-content: flex-end; font-size: 12px; font-weight: 800; align-items: center; }
.tl-block .tb-m { position: absolute; right: 8px; bottom: 3px; width: auto; }
.tb-m .num { font-family: var(--display); font-weight: 600; font-size: 14px; }
.onair-dot { color: var(--bad); animation: blink 1s infinite; }
.tb-m .bad { color: #b3122a; }
.tl-prev { pointer-events: none; z-index: 3; border: 2px dashed; font-weight: 800; font-size: 13px; align-items: center; justify-content: center; }
.tl-prev.ok { border-color: var(--good); background: rgba(22, 92, 58, 0.9); color: #fff; }
.tl-prev.no { border-color: var(--bad); background: rgba(110, 24, 34, 0.9); color: #fff; }
.tl-ad { z-index: 1; position: absolute; right: 0; width: 86px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
.tl-ad.drop { background: rgba(95, 214, 143, 0.25); box-shadow: 0 0 0 2px var(--good); }
.ac { display: block; max-width: 100%; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1.5px solid var(--line); }
.ac.empty { border-style: dashed; color: var(--line); }
.ac.set { cursor: pointer; }
.ac.ok { border-color: var(--good); color: var(--good); }
.ac.risk { border-color: var(--warn); color: var(--warn); }
.ac.bad { border-color: var(--bad); color: var(--bad); }
.ac.live { border-color: var(--bad); color: var(--text); }
.shelf { user-select: none; -webkit-user-select: none; flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 4px; scrollbar-width: thin; border-radius: 12px; transition: background 0.15s; }
.shelf.trash { background: rgba(255, 107, 107, 0.2); box-shadow: inset 0 0 0 2px var(--bad); }
.shelf-card { flex: 0 0 auto; width: 118px; min-height: 52px; border-radius: 10px; padding: 5px 7px; background: var(--gc, var(--panel-2)); color: var(--ink); display: flex; flex-wrap: wrap; gap: 0 4px; touch-action: none; cursor: grab; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.18); }
.shelf-card .tb-t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 12px; }
.shelf-card.used { opacity: 0.55; }
.sc-m { width: 100%; font-size: 11px; font-weight: 800; letter-spacing: 1px; opacity: 0.7; }
.ad-chip { flex: 0 0 auto; display: flex; gap: 5px; align-items: center; padding: 6px 10px; border-radius: 999px; background: #ffd27f; color: var(--ink); font-weight: 800; font-size: 12.5px; touch-action: none; cursor: grab; white-space: nowrap; }
.ad-chip b { background: var(--ink); color: #ffd27f; border-radius: 999px; padding: 0 6px; }
.ad-chip small { font-weight: 700; opacity: 0.75; }
.ad-chip.used { opacity: 0.4; cursor: default; }
.ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; opacity: 0.92; box-shadow: 0 10px 30px rgba(0,0,0,0.45); transform-origin: 0 0; right: auto !important; }
#panel.is-dragging .p-body { overflow: hidden; }
.g-comedy { --gc: #ffd23f; } .g-crime { --gc: #9aa8d6; } .g-drama { --gc: #f2a0a8; } .g-reality { --gc: #ffb3d1; }
.g-docu { --gc: #a8e0c0; } .g-scifi { --gc: #c7b3ff; } .g-anim { --gc: #ffc9ef; } .g-show { --gc: #ffcf8a; }
.g-cook { --gc: #f7c59f; } .g-sitcom { --gc: #9fd8ea; } .g-sport { --gc: #a6e08a; } .g-talk { --gc: #b8c4ff; }

/* Programmplaner (Blockraster) */
.plan { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; grid-auto-rows: minmax(52px, auto); gap: 5px 8px; align-items: stretch; }
.plan .hr { grid-column: 1; font-family: var(--display); font-weight: 600; font-size: 14px; padding-top: 8px; color: var(--muted); }
.plan .hr.prime { color: var(--warn); }
